services:
  - type: web
    name: blinktask-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blinktask-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://blinktask.in,https://www.blinktask.in
  - type: pserv
    name: blinktask-db
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
