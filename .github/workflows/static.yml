name: Legacy static deployment (disabled during React migration)
on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: 'Manual legacy deploy only; this may overwrite the React deployment.'
        required: true
        default: 'I understand'
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy root-folder deployment is disabled. Use the React Pages workflow instead."
